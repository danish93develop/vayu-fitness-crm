services:
  postgres:
    image: postgres:16-alpine
    container_name: vayu_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: vayu
      POSTGRES_PASSWORD: vayu_dev_password
      POSTGRES_DB: vayu_fitness_crm
    ports:
      - "5432:5432"
    volumes:
      - vayu_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vayu -d vayu_fitness_crm"]
      interval: 5s
      timeout: 5s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: vayu_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@vayu.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - vayu_pgadmin_data:/var/lib/pgadmin

volumes:
  vayu_postgres_data:
  vayu_pgadmin_data:
